[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orwox-sim"
version = "0.1.0"
description = "ORWOX ağ simülasyonu: DPI, DNS ve COV (bypass) modelleri"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
orwox-sim = "orwox_sim.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["orwox_sim*"]
